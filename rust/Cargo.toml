[package]
name = "heliox-rs"
version = "0.1.0"
edition = "2021"
description = "Rust kernels for Heliox: ASDA, the MEM proximal step and the differential rotation coordinate chain."
license = "BSD-3-Clause"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py310"] }
numpy = "0.30"
ndarray = "0.17"
rayon = "1.12"

[features]
# Enabled by maturin (see pyproject.toml). Left off for `cargo test`, which has to link libpython.
extension-module = ["pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
