[package]
name = "heliox-core"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "The Rust core of Heliox, built as the Python extension module heliox._core."
license = "BSD-3-Clause"
repository = "https://github.com/pragyaangaur/Heliox"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py310"] }
numpy = "0.30"
ndarray = "0.17"
rayon = "1.12"

[build-dependencies]
# Reads the Python that pyo3 is configured with, so build.rs can add an rpath on macOS.
pyo3-build-config = "0.30"

[features]
# Enabled by maturin (see the root pyproject.toml). Left off for plain cargo runs,
# which would otherwise have to link libpython.
extension-module = ["pyo3/extension-module"]

[profile.release]
lto = "thin"

[lints.cargo]
# numpy and rayon are here for the kernels that agents will port. Until the first
# kernel uses them, cargo would warn that they are unused.
unused_dependencies = "allow"
